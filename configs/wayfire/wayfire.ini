# Optimized GNOME Tablet Desktop Wayfire config for Samsung SM-X205 (Mali-G52 hwcomposer)

[autostart]
autostart_wf_shell = false
gnome = exec /usr/local/bin/startgnome-wf

[animate]
close_animation = zoom
duration = 220ms circle
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
fade_duration = 160ms linear
fade_enabled_for = type equals "overlay"
minimize_animation = squeezimize
open_animation = zoom
squeezimize_duration = 220ms linear
startup_duration = 240ms linear
zoom_duration = 240ms circle

[autorotate-iio]
lock_rotation = false

[blur]
blur_by_default = (type is "toplevel" | app_id is "waybar" | app_id is "gta8-dock" | app_id is "gta8-quicksettings" | app_id is "gta8-cal-notifs" | app_id is "gta8-launcher" | app_id is "gta8-keyboard" | app_id is "notifications")
kawase_degrade = 3
kawase_iterations = 2
kawase_offset = 1.800000
method = kawase
saturation = 1.150000

[command]
command_volume_down = pactl set-sink-volume @DEFAULT_SINK@ -5%
command_volume_up = pactl set-sink-volume @DEFAULT_SINK@ +5%
repeatable_binding_volume_down = KEY_VOLUMEDOWN
repeatable_binding_volume_up = KEY_VOLUMEUP

command_power = /usr/local/bin/gta8-power-toggle
always_binding_power = KEY_POWER

command_osk = /usr/local/bin/gta8-keyboard toggle
binding_osk = edge-swipe bottom 1

command_apps = /usr/local/bin/gta8-app-grid
binding_apps = edge-swipe right 1

[core]
background_color = \#131317FF
enable_text_input_v3 = true
plugins = ipc ipc-rules stipc session-lock input-method-v1 animate autostart command foreign-toplevel place resize scale expo vswipe vswitch extra-gestures window-rules wm-actions autorotate-iio idle grid xdg-activation wobbly blur winshadows
preferred_decoration_mode = server
transaction_timeout = 100
vheight = 1
vwidth = 4
xwayland = true

[extra-gestures]
close_fingers = 20
move_delay = 450
move_fingers = 3

[idle]
disable_initially = false
disable_on_fullscreen = true
dpms_timeout = -1
screensaver_timeout = -1
ipc_event_only = true
toggle = none

[input]
click_method = clickfinger
cursor_size = 24
cursor_theme = Adwaita
disable_touchpad_while_mouse = false
disable_touchpad_while_typing = false
drag_lock = false
edge_swipe_section_length = 0.150000
edge_swipe_threshold = 20
gesture_sensitivity = 5.000000
kb_capslock_default_state = false
kb_numlock_default_state = false
kb_repeat_delay = 400
kb_repeat_rate = 40
left_handed_mode = false
middle_emulation = false
modifier_binding_timeout = 400
mouse_accel_profile = default
mouse_cursor_speed = 0.000000
mouse_natural_scroll = true
mouse_scroll_speed = 1.000000
natural_scroll = true
scroll_method = default
tablet_motion_mode = default
tap_to_click = true
touchpad_accel_profile = default
touchpad_cursor_speed = 0.000000
touchpad_scroll_speed = 1.000000
xkb_layout = us
xkb_model = 
xkb_options = 
xkb_rules = evdev
xkb_variant = 

[input-method-v1]
enable_text_input_v1 = true
enable_text_input_v3 = true

[output:HWCOMPOSER-1]
depth = 8
mode = auto
position = auto
scale = 1.5
transform = normal
vrr = false

[place]
mode = maximize

[scale]
allow_zoom = false
bg_color = \#131317C8
close_on_new_view = false
drag_distance = 250
duration = 200ms circle
inactive_alpha = 0.880000
include_minimized = true
interact = true
middle_click_close = true
minimized_alpha = 0.550000
outer_margin = 16
spacing = 20
text_color = \#FFFFFFFF
title_font_size = 14
title_overlay = all
title_position = center
toggle = edge-swipe left 1
toggle_all = 

[vswipe]
delta_threshold = 18.000000
duration = 160ms
enable_free_movement = false
enable_horizontal = true
enable_smooth_transition = true
enable_vertical = false
fingers = 3
gap = 32.000000
speed_cap = 0.050000
speed_factor = 256.000000
threshold = 0.250000

[window-rules]
maximize_apps = on created if (type equals "toplevel" & !(app_id contains "calculator")) then maximize

[winshadows]
clip_shadow_inside = true
enabled_views = type is "toplevel"
glow_enabled = false
horizontal_offset = 0
include_undecorated_views = true
light_type = gaussian
overscale = 1.000000
shadow_color = \#00000080
shadow_radius = 36
vertical_offset = 6

[wobbly]
friction = 3.000000
grid_resolution = 6
spring_k = 8.000000

[workarounds]
all_dialogs_modal = true
app_id_mode = stock
discard_command_output = true
dynamic_repaint_delay = false
enable_opaque_region_damage_optimizations = true
enable_so_unloading = false
force_preferred_decoration_mode = true
remove_output_limits = false
use_external_output_configuration = false
